name: AIBudget
schemes:
  AIBudget:
    build:
      targets:
        AIBudget: all
        BudgetWidget: all
    test:
      targets: [AIBudgetTests]
options:
  bundleIdPrefix: com.yunseok.aibudget
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '0.1.0'
    CODE_SIGN_STYLE: Automatic
    APP_GROUP: group.com.yunseok.aibudget
targets:
  AIBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yunseok.aibudget.tests
    dependencies:
      - target: AIBudget
  AIBudget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../shared/ledger-core.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunseok.aibudget
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 모아 가계부
        UILaunchScreen: {}
        AppGroupIdentifier: $(APP_GROUP)
        NSFaceIDUsageDescription: 가계부 잠금 해제에 사용합니다.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [aibudget]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: BudgetWidget
        embed: true
  BudgetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: ../shared/ledger-core.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunseok.aibudget.widget
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 모아 예산
        AppGroupIdentifier: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
